<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resume Studio – Valluri Keerthi Ram</title>
  <meta name="author" content="Valluri Keerthi Ram">
  <meta name="description" content="Resume of Valluri Keerthi Ram - BTech Computer Science & Engineering">
  <meta name="keywords" content="Valluri Keerthi Ram, Resume, Computer Science, AI, Systems Engineer">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Carlito:ital,wght@0,400;0,700;1,400;1,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --paper-bg: #ffffff;
      --paper-text: #000000;
      --accent: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top Navbar */
    .topbar {
      background: var(--surface);
      border-bottom: 1px solid var(--surface-border);
      padding: 0.75rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .brand-logo {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.1rem;
      color: #fff;
    }

    .brand-title {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .brand-sub {
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    .toolbar-actions {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .select-preset {
      background: #0f172a;
      color: #f8fafc;
      border: 1px solid var(--surface-border);
      padding: 0.45rem 0.8rem;
      border-radius: 6px;
      font-size: 0.85rem;
      outline: none;
      font-weight: 500;
      cursor: pointer;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--surface-border);
      padding: 0.45rem 0.85rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      text-decoration: none;
    }

    .btn:hover {
      background: #334155;
      border-color: #475569;
    }

    .btn-primary {
      background: var(--primary);
      border-color: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
      border-color: var(--primary-hover);
    }

    .mobile-tab-bar {
      display: none;
      background: var(--surface);
      border-bottom: 1px solid var(--surface-border);
      padding: 0.4rem 0.75rem;
      gap: 0.5rem;
    }

    .mobile-tab-btn {
      flex: 1;
      padding: 0.5rem;
      text-align: center;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 6px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
    }

    .mobile-tab-btn.active {
      background: #0f172a;
      color: #38bdf8;
      border: 1px solid var(--surface-border);
    }

    /* Main Workspace */
    .workspace {
      display: flex;
      flex: 1;
      overflow: hidden;
      height: calc(100vh - 61px);
    }

    /* Editor Sidebar */
    .editor-pane {
      width: 490px;
      min-width: 360px;
      max-width: 580px;
      background: var(--surface);
      border-right: 1px solid var(--surface-border);
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .section-card {
      background: #0f172a;
      border: 1px solid var(--surface-border);
      border-radius: 8px;
      overflow: hidden;
      transition: border-color 0.15s;
    }

    .section-header {
      padding: 0.75rem 1rem;
      background: #1e293b;
      font-weight: 600;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s;
    }

    .section-header:hover {
      background: #273549;
    }

    .section-header span {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .section-header .chevron {
      font-size: 0.75rem;
      color: var(--text-muted);
      transition: transform 0.2s ease;
    }

    .section-card.is-collapsed .chevron {
      transform: rotate(-90deg);
    }

    .section-body {
      padding: 0.85rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .section-card.is-collapsed .section-body {
      display: none;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.6rem;
    }

    label {
      font-size: 0.73rem;
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    input, textarea {
      background: #1e293b;
      border: 1px solid var(--surface-border);
      color: var(--text);
      padding: 0.45rem 0.65rem;
      border-radius: 5px;
      font-size: 0.85rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s;
    }

    input:focus, textarea:focus {
      border-color: var(--accent);
    }

    textarea {
      resize: vertical;
      min-height: 48px;
      line-height: 1.35;
    }

    /* Dynamic Item Cards */
    .items-container {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }

    .item-card {
      background: #1e293b;
      border: 1px solid var(--surface-border);
      border-radius: 6px;
      padding: 0.65rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      position: relative;
      transition: border-color 0.15s, background 0.15s, opacity 0.15s;
    }

    .item-card.dragging {
      opacity: 0.4;
      border: 1px dashed var(--accent);
    }

    .item-card.drag-over {
      border: 2px dashed var(--accent);
      background: rgba(56, 189, 248, 0.08);
    }

    .item-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      padding-bottom: 0.35rem;
      margin-bottom: 0.2rem;
    }

    .drag-handle {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      cursor: grab;
      user-select: none;
      color: var(--text-muted);
      font-size: 0.82rem;
      font-weight: 600;
      max-width: 320px;
    }

    .drag-handle:active {
      cursor: grabbing;
    }

    .drag-icon {
      font-size: 1.05rem;
      line-height: 1;
      opacity: 0.7;
    }

    .item-card-title {
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-card-actions {
      display: flex;
      align-items: center;
      gap: 0.25rem;
    }

    .btn-icon {
      background: #0f172a;
      border: 1px solid var(--surface-border);
      color: var(--text-muted);
      width: 24px;
      height: 24px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.68rem;
      cursor: pointer;
      padding: 0;
      transition: background 0.15s, color 0.15s;
    }

    .btn-icon:hover {
      background: #334155;
      color: var(--text);
    }

    .btn-icon-danger {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
      width: 24px;
      height: 24px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.72rem;
      cursor: pointer;
      padding: 0;
      transition: background 0.15s, color 0.15s;
    }

    .btn-icon-danger:hover {
      background: #ef4444;
      color: white;
    }

    /* Sub-bullets list inside item card */
    .bullets-container {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      margin-top: 0.2rem;
    }

    .bullet-row {
      display: flex;
      align-items: flex-start;
      gap: 0.35rem;
    }

    .bullet-row textarea {
      flex: 1;
      min-height: 42px;
    }

    .btn-add-item {
      background: transparent;
      color: var(--accent);
      border: 1px dashed var(--accent);
      padding: 0.45rem;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      transition: background 0.15s;
      width: 100%;
    }

    .btn-add-item:hover {
      background: rgba(56, 189, 248, 0.1);
    }

    .btn-add-bullet {
      align-self: flex-start;
      background: transparent;
      color: var(--accent);
      border: none;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      padding: 0.2rem 0;
      display: flex;
      align-items: center;
      gap: 0.25rem;
    }

    .btn-add-bullet:hover {
      text-decoration: underline;
    }

    /* Preview Pane */
    .preview-pane {
      flex: 1;
      background: #090d16;
      overflow: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .page-indicator-bar {
      margin-bottom: 0.8rem;
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid var(--surface-border);
      padding: 0.4rem 0.9rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .badge-success {
      background: #065f46;
      color: #34d399;
      padding: 0.15rem 0.5rem;
      border-radius: 9999px;
      font-weight: 600;
      font-size: 0.7rem;
    }

    .badge-warning {
      background: #7c2d12;
      color: #fb923c;
      padding: 0.15rem 0.5rem;
      border-radius: 9999px;
      font-weight: 600;
      font-size: 0.7rem;
    }

    /* THE PRINTABLE RESUME SHEET (Calibri exact styling) */
    .resume-sheet {
      width: 210mm;
      min-height: 297mm;
      background: #ffffff;
      color: #000000;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      font-family: 'Calibri', 'Carlito', Arial, sans-serif;
      padding: 6mm 11mm;
      box-sizing: border-box;
      line-height: 1.15;
      font-size: 10pt;
      position: relative;
    }

    .res-header {
      text-align: center;
      margin-bottom: 3pt;
    }

    .res-name {
      font-size: 22pt;
      font-weight: bold;
      color: #000000;
      margin-bottom: 1pt;
      line-height: 1.1;
    }

    .res-contact {
      font-size: 10pt;
      color: #000000;
    }

    .res-contact a {
      color: #000000;
      text-decoration: none;
    }

    .res-contact a:hover {
      text-decoration: underline;
    }

    .res-section-title {
      font-size: 11pt;
      font-weight: bold;
      color: #000000;
      margin-top: 4.5pt;
      margin-bottom: 1.5pt;
      border-bottom: 1pt solid #000000;
      padding-bottom: 0.5pt;
      text-transform: none;
    }

    .res-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 1.5pt;
      font-size: 10pt;
    }

    .res-table td {
      padding: 0.5pt 0;
      vertical-align: top;
    }

    .res-bold {
      font-weight: bold;
    }

    .res-text-right {
      text-align: right;
      white-space: nowrap;
    }

    .res-bullets {
      margin: 0;
      padding-left: 14pt;
      font-size: 10pt;
      list-style-type: disc;
    }

    .res-bullets li {
      margin-bottom: 1pt;
      line-height: 1.15;
    }

    .res-project-block {
      margin-bottom: 2pt;
    }

    .res-pub-list {
      margin: 0;
      padding-left: 14pt;
      font-size: 10pt;
      list-style-type: disc;
    }

    .res-pub-list li {
      margin-bottom: 1pt;
      line-height: 1.15;
    }

    .res-skills-list {
      margin: 0;
      padding-left: 14pt;
      font-size: 10pt;
      list-style-type: disc;
    }

    .res-skills-list li {
      margin-bottom: 1pt;
      line-height: 1.18;
    }

    /* Print media query */
    @media print {
      body {
        background: #ffffff !important;
        color: #000000 !important;
      }
      .topbar, .mobile-tab-bar, .editor-pane, .page-indicator-bar {
        display: none !important;
      }
      .workspace {
        height: auto !important;
        overflow: visible !important;
      }
      .preview-pane {
        padding: 0 !important;
        background: transparent !important;
        overflow: visible !important;
      }
      .resume-sheet {
        box-shadow: none !important;
        width: 100% !important;
        min-height: auto !important;
        padding: 0 !important;
        margin: 0 !important;
      }
      @page {
        size: A4 portrait;
        margin: 6mm 11mm;
      }
    }

    /* Responsive Mobile UI */
    @media (max-width: 900px) {
      .topbar {
        padding: 0.5rem 0.75rem;
      }
      .brand-sub {
        display: none;
      }
      .mobile-tab-bar {
        display: flex;
      }
      .workspace {
        flex-direction: column;
        height: calc(100vh - 105px);
      }
      .editor-pane {
        width: 100%;
        max-width: none;
        border-right: none;
        display: flex;
      }
      .preview-pane {
        display: none;
        padding: 0.5rem;
      }
      .workspace.show-preview .editor-pane {
        display: none;
      }
      .workspace.show-preview .preview-pane {
        display: flex;
      }
      .resume-sheet {
        transform-origin: top center;
        max-width: 100%;
        font-size: 8.5pt;
        padding: 4mm 6mm;
      }
    }
  </style>
</head>
<body>

  <!-- Top Navigation Bar -->
  <header class="topbar">
    <div class="brand">
      <div class="brand-logo">V</div>
      <div>
        <div class="brand-title">Resume Studio</div>
        <div class="brand-sub">Valluri Keerthi Ram • 1-Page Calibrated</div>
      </div>
    </div>

    <div class="toolbar-actions">
      <select id="presetSelector" class="select-preset" onchange="loadPreset(this.value)">
        <option value="toshiba">🏢 Toshiba Software GET (IoT & Systems)</option>
        <option value="aditya">🏢 Aditya Birla Group (GDNA PRIME)</option>
        <option value="amazon">🏢 Amazon Applied Scientist Intern</option>
        <option value="myntra">🏢 Myntra SDE Intern</option>
        <option value="custom">✏️ Custom / Blank Draft</option>
      </select>

      <button class="btn btn-primary" onclick="triggerPrint()">
        🖨️ Print / Save PDF
      </button>

      <button class="btn" onclick="exportJSON()">
        💾 Export
      </button>

      <button class="btn" onclick="document.getElementById('importFile').click()">
        📂 Import
      </button>
      <input type="file" id="importFile" accept=".json" style="display: none;" onchange="importJSON(event)">
    </div>
  </header>

  <!-- Mobile View Toggle -->
  <div class="mobile-tab-bar">
    <button id="tabEdit" class="mobile-tab-btn active" onclick="switchMobileTab('edit')">✏️ Edit Fields</button>
    <button id="tabPreview" class="mobile-tab-btn" onclick="switchMobileTab('preview')">👁️ Live Resume</button>
  </div>

  <!-- Main Workspace -->
  <main class="workspace" id="workspaceContainer">
    
    <!-- Editor Pane -->
    <aside class="editor-pane">

      <!-- Profile & Contact (COLLAPSED BY DEFAULT) -->
      <div class="section-card is-collapsed" id="cardProfile">
        <div class="section-header" onclick="toggleSection('cardProfile')">
          <span>👤 Header & Contact Info</span>
          <span class="chevron">▼</span>
        </div>
        <div class="section-body">
          <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="inpName" oninput="resumeState.profile.name = this.value; updateResume();">
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Location</label>
              <input type="text" id="inpLocation" oninput="resumeState.profile.location = this.value; updateResume();">
            </div>
            <div class="form-group">
              <label>Phone</label>
              <input type="text" id="inpPhone" oninput="resumeState.profile.phone = this.value; updateResume();">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Email</label>
              <input type="email" id="inpEmail" oninput="resumeState.profile.email = this.value; updateResume();">
            </div>
            <div class="form-group">
              <label>Portfolio URL</label>
              <input type="url" id="inpPortfolio" oninput="resumeState.profile.portfolio = this.value; updateResume();">
            </div>
          </div>
        </div>
      </div>

      <!-- Education (COLLAPSED BY DEFAULT) -->
      <div class="section-card is-collapsed" id="cardEdu">
        <div class="section-header" onclick="toggleSection('cardEdu')">
          <span>🎓 Education</span>
          <span class="chevron">▼</span>
        </div>
        <div class="section-body">
          <div class="items-container" id="eduContainer"></div>
          <button class="btn-add-item" onclick="addItem('education')">+ Add Education</button>
        </div>
      </div>

      <!-- Experience (COLLAPSED BY DEFAULT) -->
      <div class="section-card is-collapsed" id="cardExp">
        <div class="section-header" onclick="toggleSection('cardExp')">
          <span>💼 Experience</span>
          <span class="chevron">▼</span>
        </div>
        <div class="section-body">
          <div class="items-container" id="expContainer"></div>
          <button class="btn-add-item" onclick="addItem('experience')">+ Add Experience</button>
        </div>
      </div>

      <!-- Projects (EXPANDED BY DEFAULT) -->
      <div class="section-card" id="cardProjects">
        <div class="section-header" onclick="toggleSection('cardProjects')">
          <span>🚀 Projects</span>
          <span class="chevron">▼</span>
        </div>
        <div class="section-body">
          <div class="items-container" id="projectsContainer"></div>
          <button class="btn-add-item" onclick="addItem('projects')">+ Add Project</button>
        </div>
      </div>

      <!-- Research & Publications -->
      <div class="section-card is-collapsed" id="cardPubs">
        <div class="section-header" onclick="toggleSection('cardPubs')">
          <span>📚 Research & Publications</span>
          <span class="chevron">▼</span>
        </div>
        <div class="section-body">
          <div class="items-container" id="pubsContainer"></div>
          <button class="btn-add-item" onclick="addItem('publications')">+ Add Publication</button>
        </div>
      </div>

      <!-- Certifications -->
      <div class="section-card is-collapsed" id="cardCerts">
        <div class="section-header" onclick="toggleSection('cardCerts')">
          <span>📜 Certifications</span>
          <span class="chevron">▼</span>
        </div>
        <div class="section-body">
          <div class="items-container" id="certsContainer"></div>
          <button class="btn-add-item" onclick="addItem('certifications')">+ Add Certification</button>
        </div>
      </div>

      <!-- Skills & Interests -->
      <div class="section-card is-collapsed" id="cardSkills">
        <div class="section-header" onclick="toggleSection('cardSkills')">
          <span>🛠️ Skills & Interests</span>
          <span class="chevron">▼</span>
        </div>
        <div class="section-body">
          <div class="items-container" id="skillsContainer"></div>
          <button class="btn-add-item" onclick="addItem('skills')">+ Add Skill Category</button>
        </div>
      </div>

    </aside>

    <!-- Live Preview Pane -->
    <section class="preview-pane">
      <div class="page-indicator-bar">
        <span>📄 Sheet Size: <strong>A4 Portrait</strong></span>
        <span>•</span>
        <span id="pageFitBadge" class="badge-success">✓ 1-Page Calibrated</span>
      </div>

      <!-- Resume Sheet Container -->
      <div class="resume-sheet" id="resumeSheet">
        <!-- Rendered dynamically by updateResume() -->
      </div>
    </section>

  </main>

  <!-- Script for Dynamic Management, Drag-and-Drop, and Presets -->
  <script>

    // ACTIVE STATE
    let resumeState = null;
    let dragSource = null;

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function toggleSection(cardId) {
      const card = document.getElementById(cardId);
      if (card) {
        card.classList.toggle('is-collapsed');
      }
    }

    function switchMobileTab(tab) {
      const ws = document.getElementById('workspaceContainer');
      const btnEdit = document.getElementById('tabEdit');
      const btnPrev = document.getElementById('tabPreview');

      if (tab === 'preview') {
        ws.classList.add('show-preview');
        btnPrev.classList.add('active');
        btnEdit.classList.remove('active');
      } else {
        ws.classList.remove('show-preview');
        btnEdit.classList.add('active');
        btnPrev.classList.remove('active');
      }
    }

    // DRAG AND DROP HANDLERS
    function handleDragStart(e, sectionKey, index) {
      dragSource = { sectionKey, index };
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', `${sectionKey}:${index}`);
      e.currentTarget.classList.add('dragging');
    }

    function handleDragOver(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      const targetCard = e.currentTarget;
      if (!targetCard.classList.contains('dragging')) {
        targetCard.classList.add('drag-over');
      }
    }

    function handleDragLeave(e) {
      e.currentTarget.classList.remove('drag-over');
    }

    function handleDrop(e, sectionKey, targetIndex) {
      e.preventDefault();
      e.stopPropagation();
      e.currentTarget.classList.remove('drag-over');

      if (!dragSource || dragSource.sectionKey !== sectionKey) return;
      const fromIndex = dragSource.index;
      if (fromIndex === targetIndex) return;

      const list = resumeState[sectionKey];
      const item = list.splice(fromIndex, 1)[0];
      list.splice(targetIndex, 0, item);

      renderSectionForm(sectionKey);
      updateResume();
    }

    function handleDragEnd(e) {
      e.currentTarget.classList.remove('dragging');
      document.querySelectorAll('.item-card').forEach(c => c.classList.remove('drag-over', 'dragging'));
      dragSource = null;
    }

    // ITEM ACTIONS (MOVE & DELETE)
    function moveItem(sectionKey, index, direction) {
      const targetIndex = index + direction;
      const list = resumeState[sectionKey];
      if (targetIndex < 0 || targetIndex >= list.length) return;

      const item = list.splice(index, 1)[0];
      list.splice(targetIndex, 0, item);

      renderSectionForm(sectionKey);
      updateResume();
    }

    function deleteItem(sectionKey, index) {
      const list = resumeState[sectionKey];
      if (list.length <= 1) {
        if (!confirm('Are you sure you want to delete the only item in this section?')) return;
      }
      list.splice(index, 1);
      renderSectionForm(sectionKey);
      updateResume();
    }

    function renderAllForms() {
      // Profile
      document.getElementById('inpName').value = resumeState.profile.name || '';
      document.getElementById('inpLocation').value = resumeState.profile.location || '';
      document.getElementById('inpPhone').value = resumeState.profile.phone || '';
      document.getElementById('inpEmail').value = resumeState.profile.email || '';
      document.getElementById('inpPortfolio').value = resumeState.profile.portfolio || '';

      renderSectionForm('education');
      renderSectionForm('experience');
      renderSectionForm('projects');
      renderSectionForm('publications');
      renderSectionForm('certifications');
      renderSectionForm('skills');
    }

    // UPDATE LIVE RESUME SHEET
    function updateResume() {
      const sheet = document.getElementById('resumeSheet');
      if (!sheet || !resumeState) return;

      const p = resumeState.profile;
      let html = '';

      // Header
      html += `
        <header class="res-header">
          <div class="res-name">${escapeHtml(p.name)}</div>
          <div class="res-contact">
            ${escapeHtml(p.location)} • <a href="mailto:${escapeHtml(p.email)}">${escapeHtml(p.email)}</a> • ${escapeHtml(p.phone)} • <a href="${escapeHtml(p.portfolio)}" target="_blank">Portfolio</a>
          </div>
        </header>
      `;

      // Education
      if (resumeState.education && resumeState.education.length > 0) {
        html += `<section><div class="res-section-title">Education</div><table class="res-table">`;
        resumeState.education.forEach(edu => {
          html += `
            <tr>
              <td><span class="res-bold">${escapeHtml(edu.institution)}</span></td>
              <td class="res-text-right">${escapeHtml(edu.location)}</td>
            </tr>
            <tr>
              <td><span>${escapeHtml(edu.degree)}</span></td>
              <td class="res-text-right">${escapeHtml(edu.dates)}</td>
            </tr>
          `;
        });
        html += `</table></section>`;
      }

      // Experience
      if (resumeState.experience && resumeState.experience.length > 0) {
        html += `<section><div class="res-section-title">Experience</div>`;
        resumeState.experience.forEach(exp => {
          html += `
            <table class="res-table">
              <tr>
                <td><span class="res-bold">${escapeHtml(exp.organization)}</span></td>
                <td class="res-text-right">${escapeHtml(exp.dates)}</td>
              </tr>
              <tr>
                <td colspan="2"><span>${escapeHtml(exp.role)}</span></td>
              </tr>
            </table>
            <ul class="res-bullets">
              ${exp.bullets.map(b => `<li>${escapeHtml(b)}</li>`).join('')}
            </ul>
          `;
        });
        html += `</section>`;
      }

      // Projects
      if (resumeState.projects && resumeState.projects.length > 0) {
        html += `<section><div class="res-section-title">Projects</div>`;
        resumeState.projects.forEach(proj => {
          html += `
            <div class="res-project-block">
              <table class="res-table">
                <tr>
                  <td><span class="res-bold">${escapeHtml(proj.title)}</span></td>
                  <td class="res-text-right">${escapeHtml(proj.dates)}</td>
                </tr>
                <tr>
                  <td colspan="2"><span>${escapeHtml(proj.tags)}</span></td>
                </tr>
              </table>
              <ul class="res-bullets">
                ${proj.bullets.map(b => `<li>${escapeHtml(b)}</li>`).join('')}
              </ul>
            </div>
          `;
        });
        html += `</section>`;
      }

      // Research & Publications
      if (resumeState.publications && resumeState.publications.length > 0) {
        html += `<section><div class="res-section-title">Research & Publications (First Authors)</div><ul class="res-pub-list">`;
        resumeState.publications.forEach(pub => {
          html += `<li><span class="res-bold">${escapeHtml(pub.prefix)}</span><span>${escapeHtml(pub.title)}</span></li>`;
        });
        html += `</ul></section>`;
      }

      // Certifications
      if (resumeState.certifications && resumeState.certifications.length > 0) {
        html += `<section><div class="res-section-title">Certifications</div><table class="res-table">`;
        resumeState.certifications.forEach(cert => {
          html += `
            <tr>
              <td><span class="res-bold">${escapeHtml(cert.name)}</span></td>
              <td class="res-text-right">${escapeHtml(cert.date)}</td>
            </tr>
          `;
          if (cert.credentialId && cert.credentialId.trim()) {
            html += `<tr><td colspan="2">${escapeHtml(cert.credentialId)}</td></tr>`;
          }
        });
        html += `</table></section>`;
      }

      // Skills & Interests
      if (resumeState.skills && resumeState.skills.length > 0) {
        html += `<section><div class="res-section-title">Skills & Interests</div><ul class="res-skills-list">`;
        resumeState.skills.forEach(s => {
          let cat = s.category.trim();
          if (!cat.endsWith(':')) cat += ':';
          html += `<li><span class="res-bold">${escapeHtml(cat)} </span><span>${escapeHtml(s.items)}</span></li>`;
        });
        html += `</ul></section>`;
      }

      sheet.innerHTML = html;
      checkPageOverflow();
    }

    function checkPageOverflow() {
      const sheet = document.getElementById('resumeSheet');
      const badge = document.getElementById('pageFitBadge');
      if (!sheet || !badge) return;

      // A4 is 297mm height, approx 1125px at 96 DPI
      const maxHeight = 1125;
      if (sheet.scrollHeight > maxHeight) {
        badge.className = 'badge-warning';
        badge.innerText = '⚠️ Content Exceeds 1 Page (Reduce text slightly)';
      } else {
        badge.className = 'badge-success';
        badge.innerText = '✓ 1-Page Calibrated';
      }
    }

    // PRESET LOADING
    function loadPreset(key) {
      const data = PRESETS[key] || PRESETS.toshiba;
      resumeState = JSON.parse(JSON.stringify(data));
      renderAllForms();
      updateResume();
    }

    // EXPORT & IMPORT
    function exportJSON() {
      const blob = new Blob([JSON.stringify(resumeState, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `Valluri_Keerthi_Ram_Resume_${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function importJSON(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const data = JSON.parse(e.target.result);
          PRESETS['custom'] = data;
          document.getElementById('presetSelector').value = 'custom';
          resumeState = JSON.parse(JSON.stringify(data));
          renderAllForms();
          updateResume();
          alert('Resume data loaded successfully!');
        } catch (err) {
          alert('Error reading JSON file: ' + err.message);
        }
      };
      reader.readAsText(file);
    }

    function triggerPrint() {
      const orig = document.title;
      document.title = 'Valluri_Keerthi_Ram_Resume';
      window.print();
      setTimeout(() => { document.title = orig; }, 1000);
    }

    // INITIALIZATION
    window.addEventListener('DOMContentLoaded', () => {
      loadPreset('toshiba');
    });
